name: Release assets

# At each release, and on demand: the demo animation of the README (#10) and the qualification matrix of the CPU core
# (#27), rebuilt from the tagged sources, attached to the release and kept as artifacts. To refresh the copies committed
# in docs/, download them and commit: docs/images/siliconforge.gif, docs/qualification/.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    env:
      CC: gcc-16
      CXX: g++-16
    steps:
      - name: Install the toolchains
        run: |
          apt-get update
          apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            ca-certificates git cmake ninja-build gcc-16 g++-16 gcc-avr avr-libc binutils-avr make libwebkitgtk-6.0-dev xvfb xauth gh
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DSILICONFORGE_WARNINGS_AS_ERRORS=ON
          cmake --build build
      - name: Qualification
        # The tests of the core from a clean slate, then the matrix in docs/qualification of the workspace.
        run: cmake --build build --target qualification
      - name: Demo animation
        run: |
          cd build && ctest --output-on-failure -R '^UI-Tour$' && cd ..
          frames=build/tests/webfront-jasmine/UI-Tour/captures/demo
          build/tools/captures2gif "$frames" build/siliconforge.gif --fps "$(awk -v n="$(ls "$frames" | wc -l)" 'BEGIN { print n / 4 }')"
          [ "$(stat -c %s build/siliconforge.gif)" -lt 2000000 ] || { echo "The animation is over 2 MB"; exit 1; }
      - name: Keep the assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/siliconforge.gif
            docs/qualification
      - name: Attach them to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tar czf qualification.tar.gz docs/qualification
          gh release upload "${{ github.event.release.tag_name }}" build/siliconforge.gif qualification.tar.gz --clobber
