name: Build and Test

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-gcc16:
    runs-on: ubuntu-24.04
    # GCC 16 and the AVR toolchain come from Ubuntu 26.04.
    container: ubuntu:26.04
    timeout-minutes: 30
    env:
      CC: gcc-16
      CXX: g++-16
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
    steps:
      - name: Install the toolchains
        run: |
          apt-get update
          apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            ca-certificates git cmake ninja-build gcc-16 g++-16 gcc-avr avr-libc binutils-avr make python3 libwebkitgtk-6.0-dev xvfb xauth
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: cpm-
      - name: Configure
        run: mkdir -p build && cd build && cmake .. -G Ninja -DSILICONFORGE_WARNINGS_AS_ERRORS=ON -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
      - name: Build
        run: cmake --build build
      - name: Test
        run: cd build && ctest --output-on-failure -LE ui
      - name: Test native UI
        if: success() || failure()
        # The runner's kernel forbids the user namespaces WebKit's bubblewrap sandbox needs; the page under test is our own.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: cd build && ctest --output-on-failure --no-tests=error -L ui
      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: build/tests/webfront-jasmine/*/report.json
          if-no-files-found: warn
      - name: Check that firmware/prebuilt is up to date
        # CMake built firmware/src with avr-gcc into build/firmware; the committed binaries must match byte for byte.
        run: |
          status=0
          for committed in firmware/prebuilt/*.hex; do
            cmp "$committed" "build/firmware/$(basename "$committed")" || status=1
          done
          [ "$status" -eq 0 ] || { echo "firmware/prebuilt is stale: run 'make -C firmware prebuilt' and commit the result"; exit 1; }
      - name: Emulation speed (headless)
        run: build/apps/siliconforge/siliconforge --headless --speed max --duration 10 build/firmware/blink.hex
