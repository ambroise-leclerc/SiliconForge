name: Build and Test

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-gcc16:
    runs-on: ubuntu-24.04
    # GCC 16 and the AVR toolchain come from Ubuntu 26.04.
    container: ubuntu:26.04
    timeout-minutes: 30
    env:
      CC: gcc-16
      CXX: g++-16
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
    steps:
      - name: Install the toolchains
        run: |
          apt-get update
          apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            ca-certificates git cmake ninja-build gcc-16 g++-16 gcc-avr avr-libc binutils-avr make libwebkitgtk-6.0-dev xvfb xauth
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt', 'tools/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: cpm-
      - name: Configure
        run: mkdir -p build && cd build && cmake .. -G Ninja -DSILICONFORGE_WARNINGS_AS_ERRORS=ON -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
      - name: Build
        run: cmake --build build
      - name: Test
        run: cd build && ctest --output-on-failure -LE ui
      - name: Test native UI
        if: success() || failure()
        # WebFront opens WebKitGTK in development mode, without its sandbox (docs/WEBFRONT-1.0.md): the runner's kernel
        # forbids the user namespaces the sandbox needs, and the page under test is our own.
        run: cd build && ctest --output-on-failure --no-tests=error -L ui
      - name: Animate the tour of the interface
        # The demo animation of the README, from the sequence UI-Tour recorded in the real window (#10).
        if: always()
        continue-on-error: true
        run: |
          frames=build/tests/webfront-jasmine/UI-Tour/captures/demo
          count=$(ls "$frames" | wc -l)
          build/tools/captures2gif "$frames" build/siliconforge.gif --fps "$(awk -v n="$count" 'BEGIN { print n / 4 }')"
          [ "$(stat -c %s build/siliconforge.gif)" -lt 2000000 ] || { echo "The animation is over 2 MB"; exit 1; }
      - name: Qualification matrix
        # Consolidates what the tests above measured (ADR 0006): opcode coverage, cycles, programs, simavr differential.
        if: always()
        run: build/tests/qualification/siliconforge_qualification matrix --results build/qualification --out build/qualification/matrix
      - name: Upload the qualification matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification
          path: |
            build/qualification/matrix
            build/qualification/*.json
            build/qualification/programs
          if-no-files-found: warn
      - name: Upload the captures of the interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-captures
          path: |
            build/siliconforge.gif
            build/tests/webfront-jasmine/UI-Tour/captures/*.png
          if-no-files-found: warn
      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: build/tests/webfront-jasmine/*/report.json
          if-no-files-found: warn
      - name: Check that firmware/prebuilt is up to date
        # CMake built firmware/src with avr-gcc into build/firmware. Every firmware listed by the Makefile (test variants
        # excluded) must have its committed .hex, identical to the compiled ones, and prebuilt/ must hold nothing else.
        run: |
          status=0
          expected=$(make -s -C firmware list)
          for name in $expected; do
            [ -f "firmware/prebuilt/$name.hex" ] || { echo "firmware/prebuilt/$name.hex is missing"; status=1; continue; }
            cmp "firmware/prebuilt/$name.hex" "build/firmware/$name.hex" || status=1
          done
          for committed in firmware/prebuilt/*.hex; do
            name=$(basename "$committed" .hex)
            echo "$expected" | grep -qx "$name" || { echo "$committed has no firmware in firmware/Makefile"; status=1; }
          done
          [ "$status" -eq 0 ] || { echo "firmware/prebuilt is stale: run 'make -C firmware prebuilt' and commit the result"; exit 1; }
      - name: Emulation speed (headless)
        run: build/apps/siliconforge/siliconforge --headless --speed max --duration 10 build/firmware/blink.hex

  macos-tools:
    # The C++ tools and unit tests that replace Python (#50). The application is not built: WebFront does not compile with
    # AppleClang's libc++ yet (docs/PYTHON-STUDY.md).
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-macos-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt', 'tools/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: cpm-macos-
      - name: Configure
        run: cmake -S . -B build -DSILICONFORGE_WARNINGS_AS_ERRORS=ON -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
      - name: Build
        run: cmake --build build --target atdf2json captures2gif siliconforge_tests
      - name: Test
        run: |
          build/tests/siliconforge_tests
          cd build && ctest --output-on-failure -R Atdf2JsonCommandLine

  windows-msvc:
    # The whole build and CTest suite on MSVC with /W4 /WX (#50), Release like the other jobs. The WebView2 interface
    # tests (label ui: the agent terminal only, docs/TERMINAL.md) need a desktop session and run by hand, and the firmware is not compiled (no avr-gcc): prebuilt hex files.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-windows-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt', 'tools/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: cpm-windows-
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DSILICONFORGE_WARNINGS_AS_ERRORS=ON -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
      - name: Build
        shell: bash
        run: cmake --build build
      - name: Test
        shell: bash
        run: cd build && ctest --output-on-failure --no-tests=error -LE ui
